spring.application.name=Assignment7MultipartUpload2ReadFileApplication
server.port=2000

#DB
spring.datasource.url=jdbc:mysql://****:****/****
spring.datasource.username=****
spring.datasource.password=****
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#JPA - Hibernate DDL
#spring.jpa.hibernate.ddl-auto=update
#spring.jpa.generate-ddl=true
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

#Multipart Configuration
# Maximum file size
spring.servlet.multipart.max-file-size=10MB

# Maximum request size (includes all files and form data)
spring.servlet.multipart.max-request-size=10MB

#Swagger Configuration
# Enable or disable Swagger UI
springdoc.swagger-ui.enabled=true

# Custom path for Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html

# API docs path (OpenAPI JSON)
springdoc.api-docs.path=/v3/api-docs

# Customize title or description (using application info)
#springdoc.swagger-ui.title=Multipart File Upload 2
#springdoc.swagger-ui.description=API documentation for Files Reading Multipart API

# Sort endpoints alphabetically
springdoc.swagger-ui.operationsSorter=alpha

# Sort tags alphabetically
springdoc.swagger-ui.tagsSorter=alpha

# Display request duration
springdoc.swagger-ui.displayRequestDuration=true
